# M03 feeder → final handoff altitudes (M03 SOP 2-2-2b ARE, 2-2-3b ARW). All at 210 kt or less.
feeder_altitudes:
  airport: MEM
  speed: "210 kt or less"
  src: [m03-tracon-sop#2-2-2, m03-tracon-sop#2-2-3]
  rows:
    - { traffic: "Base traffic (36/18)", are: 5000, arw: 6000 }
    - { traffic: "Downwind traffic (36/18)", are: 3000, arw: 4000 }
    - { traffic: "North traffic to 27", are: 4000, arw: 5000 }
    - { traffic: "South traffic to 27", are: 5000, arw: 7000 }
    - { traffic: "Across the airport to the adjacent arrival", are: 8000, arw: 9000, note: "Remain within ARE's airspace unless coordinated" }

# M03 approach scratchpads (M03 SOP 6-1-2).
scratchpads:
  - { facility: M03, kind: primary, runway: 18L, visual: 18L, instrument: 18E, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: 18C, visual: 18C, instrument: 18M, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: 18R, visual: 18R, instrument: 18W, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: 36L, visual: 36L, instrument: 36W, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: 36C, visual: 36C, instrument: 36M, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: 36R, visual: 36R, instrument: 36E, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: "9", visual: "9", instrument: 9N, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, kind: primary, runway: "27", visual: "27", instrument: 27N, src: m03-tracon-sop#6-1-2 }

secondary_scratchpads:
  - { facility: M03, code: V/A, meaning: Cleared visual approach, src: m03-tracon-sop#6-1-2 }
  - { facility: M03, code: V/F, meaning: "Cleared visual approach, following preceding aircraft", src: m03-tracon-sop#6-1-2 }
  - { facility: M03, code: V/S, meaning: Maintaining visual separation from the nearest arrival on the adjacent final, src: m03-tracon-sop#6-1-2 }

