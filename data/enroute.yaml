# Splits. stratum `area` = combined area splits (preferred; 3-2-1). LO/HI/UH need senior staff,
# the EC, an event CIC, or their designee (3-2-1d). `freq` overrides the sector list frequency
# where a split table prints a different one.
splits:
  - { stratum: area, ways: 1, label: Combined, positions: [{ sector: "22" }], src: zme-enroute-sop#3-2-1 }
  - { stratum: area, ways: 2, label: 2-way, positions: [{ sector: "22" }, { sector: "63" }], src: zme-enroute-sop#3-2-1 }
