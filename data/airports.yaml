    - { label: Tower hours, value: "0700–2100 local", src: m03-tracon-sop#3-1-1 }
    - { label: IFR departure heading, value: "Rwy 36: turn heading 090 (unless M03 requests different). Rwy 18: runway heading.", src: minor-field-reference#KOLV 2.2 }
    - { label: Class B caution, value: "MEM Class B surface area begins 2.5 NM NW of OLV; outer shelf begins at 1,800. Takeoff clearance is not a Class B clearance.", src: minor-field-reference#KOLV 2.2 }
    - { label: Tower closed, value: "When OLV tower is closed and Final 9/27 (ARN) is not staffed, Arrival East issues OLV departure clearances", src: m03-tracon-sop#2-2-2 }
