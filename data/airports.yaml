# Airports. `group: major` and `group: minor` appear in the top-bar airport selector;
# `group: satellite` are uncontrolled/secondary fields listed on APP/DEP and CTR only.
# hours: list of {days, open, close} in local time (America/Chicago); close < open spans midnight.
# Omit hours for a 24/7 tower; use `uncontrolled: true` for fields with no tower.

- id: MEM
  icao: KMEM
  name: Memphis International
  group: major
  tracon: M03
  class: B
  elevation: 341
  dtpp: "00253"
  runways: [36L, 36C, 36R, 18L, 18C, 18R, "9", "27"]
  calm_flow: north
  pdc: true
  h24: true
