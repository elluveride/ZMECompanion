      src: minor-field-reference#KOLV 2.1
      items:
        - "Issue clearances to departing IFR aircraft: maintain 2,000, expect filed cruise altitude (if higher) ten minutes after departure."
        - "Departure frequency from Table 3 — first staffed option wins, moving down the list."
        - "Control ground traffic on all movement areas except active runways."
        - "Ensure departures have the current altimeter or pertinent departure information; current ATIS meets this."
