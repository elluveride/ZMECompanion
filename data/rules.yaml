# Callouts rendered on position pages. scope: ALL (every page) or a role (DEL/GND/TWR/APP/CTR).
# airport: omit for rules that apply everywhere on that page.

# ---- Cross-cutting (ZME GOP) ----
- { id: signon-brief, scope: ALL, kind: checklist, title: Sign on, text: "Before priming, get a brief from the controller you're relieving (including top-down): weather, flow, special instructions, operational difficulties, TMIs. The position isn't yours until control is given.", src: zme-general-operating-procedures#4-1-1 }
- { id: signon-hour, scope: ALL, kind: checklist, title: Sign on, text: "Don't open a position intending to work it for less than 1 hour. Connect with VATSIM/ZME-approved callsigns only.", src: zme-general-operating-procedures#4-1-1 }
- { id: teamspeak, scope: ALL, kind: checklist, title: Sign on, text: "Be connected to the ZME TeamSpeak whenever you're logged into a position; all coordination happens there.", src: zme-general-operating-procedures#4-1-3 }
- { id: signoff, scope: ALL, kind: checklist, title: Sign off, text: "Post a notice in ATC chat to notify neighbouring facilities, and brief your relief (facility or top-down) before releasing the position.", src: zme-general-operating-procedures#4-1-2 }
- { id: vatis, scope: ALL, kind: rule, title: vATIS, text: "Broadcast vATIS only where a real-world ATIS exists, and only for facilities under your control.", src: zme-general-operating-procedures#4-1-4 }
- { id: cab-splits, scope: ALL, kind: rule, title: Tower-cab splits, text: "No TWR/GND/DEL position may be split (e.g. GND 1 / GND 2) unless TWR, GND and DEL are all already staffed, or the EC approves during an event. TRACON and enroute splits are at the controller's discretion — split only for an operational advantage.", src: zme-general-operating-procedures#4-2-4 }

# ---- DEL ----
- { id: pdc-airports, scope: DEL, kind: rule, title: PDC, text: "PDCs are issued only at MEM, BNA and LIT — and are required there for eligible flights.", src: [zme-pre-departure-clearance-policy#3-1-1, kmem-atct-sop#2-1-4] }
- { id: pdc-asap, scope: DEL, kind: rule, title: PDC timing, text: "Send the PDC as soon as practical once the flight plan lands in vTDLS — including prefiled plans before the pilot connects. A pilot asking for clearance on frequency may be treated as not PDC-capable.", src: zme-pre-departure-clearance-policy#4-1-2 }
- { id: pdc-freq, scope: DEL, kind: rule, title: PDC departure frequency, text: "Verify vTDLS's automatic departure-frequency selection, select it manually, or set an override. Remove the override when departure positions open and de-combine.", src: zme-pre-departure-clearance-policy#2-1-1 }
- { id: pdc-amend, scope: DEL, kind: rule, title: Amendments, text: "Review every flight plan before a PDC. If it needs an amendment, don't PDC — clear by voice. Adding, removing or changing a SID is not an amendment. Amend in the flight plan editor or ERAM, then close and re-select the flight to reprocess.", src: [zme-pre-departure-clearance-policy#4-1-1, zme-pre-departure-clearance-policy#4-1-3] }
- { id: rnav-jets, scope: DEL, airport: MEM, kind: rule, title: RNAV SIDs, text: "RNAV SIDs are jets only. Props and no-SID flights get the ELVIS#.", src: ["reference-card#MEM Departures", m03-tracon-sop#5-1-1] }
- { id: night-sids, scope: DEL, airport: MEM, kind: warning, title: Night-only SIDs, text: "AUTMN, BINKY, GENEH, GMBUD, GRRIZ, HOTRD, NIKEI, OLEMS and ELVIS NFIVE/EFOUR/STREE/SFOUR/WFOUR/WFIVE: 0200–0600 local without coordination; any other time only by pre-arranged M03 approval. SONEI (AOA 8,000) and NRONE (AOA 15,000) always need pre-arranged M03 coordination.", src: kmem-atct-sop#2-1-3 }
- { id: bna-climb-via, scope: DEL, airport: BNA, kind: rule, title: BNA initial altitude, text: "RNAV SID requesting ≥15,000: \"climb via SID\". Requesting <15,000: \"climb via SID except maintain 4,000\". Props / no SID: maintain 4,000.", src: kbna-atcttracon-sop#2-1-2 }
- { id: minor-gnd-clears, scope: DEL, kind: rule, title: Minor fields, text: "At minor towers GND issues IFR clearances: initial altitude, \"expect filed altitude 10 minutes after departure\", the first staffed departure frequency from the airport's list (falling back to Memphis Center 132.550), and the current altimeter or ATIS.", src: minor-field-reference }

# ---- GND ----
- { id: crossings, scope: GND, airport: MEM, kind: rule, title: Runway crossings, text: "Every runway crossing is explicitly coordinated with the appropriate Local controller.", src: kmem-atct-sop#3-1-1 }
- { id: twy-s-local, scope: GND, airport: MEM, kind: warning, title: Delegated to Local, text: "Taxiway S and all extensions south of taxiway B to runway 36C belong to Local, to prevent runway incursions. LC2 also provides ground service between 36C/18C and 36R/18L south of B.", src: [kmem-atct-sop#3-2-1, kmem-atct-sop#4-2-1] }
- { id: taxi-direction, scope: GND, airport: MEM, kind: rule, title: High volume, text: "Taxi departures to the runway for their direction of flight (see the taxi-by-direction table).", src: kmem-atct-sop#3-1-1 }
- { id: bna-crossings, scope: GND, airport: BNA, kind: rule, title: Runway crossings, text: "All crossings explicitly coordinated: \"Local, Ground, one to cross 31 at T4\" → \"One to cross 31 at T4 approved\" → \"Crossing complete runway 31 at T4\". All ramps are non-movement.", src: [kbna-atcttracon-sop#3-1-2, kbna-atcttracon-sop#3-1-1] }
- { id: hsv-crossings, scope: GND, airport: HSV, kind: rule, title: Active runways, text: "Verbally coordinate any active-runway crossing with LC, stating runway and intersection. Advise LC of taxiing aircraft for an intersection departure.", src: khsv-atcttracon-sop#2-2-2 }

# ---- TWR ----
- { id: rnav-takeoff, scope: TWR, airport: MEM, kind: rule, title: RNAV takeoff clearance, text: "Except for 9/27, takeoff clearance on an RNAV SID includes \"RNAV <first waypoint>\".", src: "reference-card#MEM Departures" }
- { id: rwy-9-27, scope: TWR, airport: MEM, kind: rule, title: Runway 9/27 departures, text: "Fly runway heading; M03 vectors them to the SID's 9/27 waypoint.", src: [mem-departure-reference, m03-tracon-sop#5-1-1, "reference-card#MEM Departures"] }
- { id: heading-when, scope: TWR, airport: MEM, kind: rule, title: When to assign a heading, text: "ELVIS, No-SID and VFR aircraft — and RNAV turbojets when a preceding non-turbojet departure with a conflicting course is within 7 NM of the Departure Climb Area.", src: kmem-atct-sop#4-1-5 }
- { id: go-around, scope: TWR, airport: MEM, kind: rule, title: Go-around / missed, text: "Runway heading and 5,000, then coordinate with the overlying radar controller (script tab). Tower separates arrivals, departures (including go-arounds) and overflights.", src: kmem-atct-sop#4-1-3 }
- { id: lc1-lc3, scope: TWR, airport: MEM, kind: rule, title: LC1 / LC3, text: "LC1 gets a release from LC3 before each 36L departure when runway 9 is an arrival runway. LC3 coordinates each 9/27 departure release with LC1/LC2.", src: kmem-atct-sop#4-2-1 }
- { id: top-alt, scope: TWR, airport: MEM, kind: rule, title: Departure top altitude, text: "Props 3,000, jets 5,000 (downwind arrivals are descending to 8,000). VFR departures get ELVIS headings for their direction unless coordinated.", src: [m03-tracon-sop#5-1-2, m03-tracon-sop#4-1-2] }
- { id: crda, scope: TWR, airport: MEM, kind: rule, title: CRDA (south flow), text: "Only weight categories E–I are authorized on runway 27 during CRDA ops.", src: [kmem-atct-sop#4-1-4, crda-guide] }
- { id: bna-rnav-to, scope: TWR, airport: BNA, kind: rule, title: RNAV takeoff clearance, text: "Instruct RNAV departures \"RNAV to\" the initial waypoint — e.g. \"SWA2103, RNAV to FRNCS, Runway 2L cleared for takeoff.\" All 13/31 departures get runway heading.", src: [kbna-atcttracon-sop#4-1-5, bna-rnav-departure-reference] }
- { id: bna-ga, scope: TWR, airport: BNA, kind: rule, title: Go-around / missed, text: "Runway heading and 4,000, then coordinate with the overlying radar controller.", src: kbna-atcttracon-sop#4-1-3 }
- { id: lit-ga, scope: TWR, airport: LIT, kind: rule, title: Go-around, text: "Coordinate with Departure: \"Departure, Local, go around\" … e.g. \"DAL154 going around, heading 080 & 4,000\".", src: klit-atcttracon-sop#4-1-3 }

# ---- APP/DEP ----
- { id: m03-staffing, scope: APP, airport: MEM, kind: rule, title: Staffing order, text: "Arrival East (MEM_E_APP) is the combined position. Final West (MEM_F_APP) is the primary final — no other final until it's open.", src: [m03-tracon-sop#2-2-1, m03-tracon-sop#2-2-4] }
- { id: toc-tower, scope: APP, airport: MEM, kind: rule, title: Switch to tower, text: "No earlier than 20 DME MEM and no later than the FAF for instrument approaches; on entering the Class B surface area for visuals. 9/27 arrivals enter the surface area on the final approach course.", src: m03-tracon-sop#4-1-1 }
- { id: not-landing-mem, scope: APP, airport: MEM, kind: rule, title: Through tower airspace, text: "Aircraft (IFR or VFR) in MEM ATCT's airspace but not landing MEM: radar hand off to MEM ATCT before the shared boundary.", src: [m03-tracon-sop#4-1-1, m03-tracon-sop#4-1-2] }
- { id: feeder-release, scope: APP, airport: MEM, kind: rule, title: Feeder → final, text: "Feeders release control to the finals inside 30 DME MEM for descent and turns toward the airport, and up to 30° away. Point out aircraft not tagged to the right departure position.", src: [m03-tracon-sop#2-2-2, m03-tracon-sop#2-2-3] }
- { id: dependent, scope: APP, airport: MEM, kind: rule, title: Parallel finals, text: "1.5 NM radar separation between successive arrivals on adjacent localizers (simultaneous dependent). Vertical on turn-on: aircraft from the east at odd altitudes, from the west at even, unless coordinated.", src: m03-tracon-sop#2-2-4 }
- { id: vfr-arrivals, scope: APP, airport: MEM, kind: rule, title: VFR, text: "VFR arrivals: clear into the Class Bravo, vector to the arrival side, hand to tower before its airspace. VFR departures get ELVIS headings for their direction.", src: m03-tracon-sop#4-1-2 }
- { id: dep-flow, scope: APP, airport: MEM, kind: rule, title: Departure flow, text: "Once clear of conflicts: jets to 16,000 (or lower cruise) on course; props to 14,000 then release climb to ZME. Coordinate departures entering Final airspace. Hand to ZME before 16,000 and/or 5 NM from the TRACON boundary. Coordinate with LC when jet departures are stopped below 4,000.", src: [m03-tracon-sop#5-1-2, m03-tracon-sop#2-2-5] }
- { id: pacp, scope: APP, airport: MEM, kind: rule, title: P-ACP, text: "Departure (DR-A/DR-V) may cut through the long-side STAR vector areas of AR-E/AR-W after checking the arrival data blocks; Departure keeps standard separation from everything in P-ACP airspace; Arrival keeps its traffic on the projected route and advises untracked targets. Under P-ACP, quick-look all arrival/final positions. ARF/M may enter ARN airspace while quick-looking N. Revert to standard coordination if impractical.", src: [m03-tracon-sop#5-1-3, m03-tracon-sop#2-2-5] }
- { id: initial-tracon, scope: APP, airport: MEM, kind: rule, title: Approach assignment, text: "The initial TRACON controller assigns the runway/approach to expect and sets the approach scratchpad.", src: m03-tracon-sop#6-1-1 }
- { id: arrivals-descend-via, scope: APP, airport: MEM, kind: rule, title: Arrivals, text: "Jets: \"descend via\" the STAR, indicate landing direction. Turboprops: direct BRBBQ/BLUZZ/VANZE/HOBRK, direct MEM, cross the TCP at 8,000.", src: "reference-card#Arrivals (KMEM only)" }
- { id: satellite-hours, scope: APP, airport: MEM, kind: rule, title: Satellite towers, text: "Simulate each satellite tower's hours of operation (see the Satellites card).", src: m03-tracon-sop#3-1-1 }

# ---- CTR ----
- { id: v9-j35, scope: CTR, kind: rule, title: V9 and J35, text: "Northbound: altitudes for 000–179°. Southbound: altitudes for 180–359° — unless coordinated. MEM arrivals on the SQS transition of MARVELL/HOBRK need no direction-of-flight coordination by Sector 66 with Sector 15.", src: zme-enroute-sop#3-1-3 }
- { id: auto-handoff, scope: CTR, kind: rule, title: Automated altitude handoffs, text: "OK when the aircraft is at, climbing to or descending to the data-block altitude. Pilot's-discretion clearances need verbal coordination (except as AITs specify).", src: zme-enroute-sop#3-1-4 }
- { id: stratum-change, scope: CTR, kind: rule, title: Changing stratum, text: "Clear to the lowest/highest altitude in your stratum, coordinate, hand off, then transfer for the climb/descent. TOC releases an aircraft at or descending to the bottom of a stratum for PD descent unless coordinated.", src: zme-enroute-sop#3-1-4 }
- { id: split-auth, scope: CTR, kind: rule, title: Splits, text: "Combined area splits are preferred. UH/HI/LO splits need senior staff, the EC, an event CIC, or their designee.", src: zme-enroute-sop#3-2-1 }
- { id: loa-wins, scope: CTR, kind: warning, title: LOAs, text: "The Reference Card summarises the LOAs. Where they differ, the LOA wins — open the PDF.", src: "reference-card#External LOAs" }
